version: '3.9'

services:
  # ===================== MICROSERVICES =====================

  reputation:
    build:
      context: ./app/reputation_service
    container_name: reputation_container
    command: python reputation.py
    ports:
      - "8081:8081"
    env_file:
      - .env
    networks:
      - iotnet

  web:
    build:
      context: ./app/web_app
    container_name: web_container
    command: python web.py
    ports:
      - "8082:8082"
    env_file:
      - .env
    networks:
      - iotnet

  catalog:
    build:
      context: ./app/catalog_service
    container_name: catalog_container
    command: python catalog2.py
    ports:
      - "8084:8084"
    env_file:
      - .env
    networks:
      - iotnet

  telegram_bot:
    build:
      context: ./telegram_bot
    container_name: telegram_bot
    command: python bot.py
    ports:
      - "8085:8085"
    dns:
    - 8.8.8.8
    - 1.1.1.1
    env_file:
      - .env
    networks:
      - iotnet

  simulator:
    build:
      context: ./app/simulation_service
    container_name: simulator
    command: python Test_simulation.py
    depends_on:
      - mosquitto
    env_file:
      - .env
    networks:
      - iotnet

  # ==================== DATABASES =====================

  mongo:
    image: mongo:5.0
    container_name: mongo_container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      #- ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - iotnet

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    env_file:
      - .env
    volumes:
      - influxdb-storage:/var/lib/influxdb2
    networks:
      - iotnet

  # Python-based InfluxDB writer/adapter
  influx_adapter:
    build:
      context: ./app/DB_service
    container_name: db_container
    depends_on:
    - influxdb
    ports:
      - "8090:8086"
    env_file:
      - .env
    networks:
      - iotnet


  # ====================== MQTT =====================

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - iotnet

volumes:
  mongo-data:
  influxdb-storage:

networks:
  iotnet:
    driver: bridge
