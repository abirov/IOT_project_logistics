version: '3.9'

services:
  reputation:
    build:
      context: ./app/reputation_service
    container_name: reputation_container
    command: python reputation.py
    ports:
      - "8081:8081"
    networks:
      - iotnet

  web:
    build:
      context: ./app/web_app
    container_name: web_container
    command: python web.py
    ports:
      - "8082:8082"
    networks:
      - iotnet

  influx:
    build:
      context: ./app/DB_service
    container_name: db_container
    command: python influxservice.py
    ports:
      - "8083:8083"
    volumes:
      - influx-data:/var/lib/influxdb

    networks:
      - iotnet


  catalog:
    build:
      context: ./app/catalog_service
    container_name: catalog_container
    command: python catalog2.py
    ports:
      - "8084:8084"
    networks:
      - iotnet

  telegram_bot:
    build:
      context: ./telegram_bot
    container_name: telegram_bot
    command: python bot.py
    ports:
      - "8085:8085"
    networks:
      - iotnet

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - iotnet

  simulator:
    build:
      context: ./app/simulation_service
    container_name: simulator
    command: python Test_simulation.py
    depends_on:
      - mosquitto
    networks:
      - iotnet

  mongo:
    image: mongo:5.0
    container_name: mongo_container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - iotnet

volumes:
    mongo-data:
    influx-data:

networks:
  iotnet:
    driver: bridge